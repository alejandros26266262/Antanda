function saveLetter(shared){const title=$('#letterTitle').value.trim(),body=$('#letterBody').value.trim();if(!body)return toast('Primero escribe la carta');db.letters.unshift({id:uid(),title:title||'Una carta',body,shared,date:new Date().toLocaleDateString('es-PE')});save();letterDraft='';isEditingLetter=false;render();toast(shared?'Carta marcada para compartir (solo en este dispositivo por ahora)':'Borrador guardado en este navegador')}function clearLetter(){letterDraft='';isEditingLetter=false;render()}function readLetter(id){const l=db.letters.find(x=>x.id===id);if(!l)return;openModal(`<h3>${esc(l.title)}</h3><div class="letter-sheet preview-letter" style="max-height:55dvh">${esc(l.body)}</div><p class="privacy">${l.shared?'Marcada para compartir':'Borrador local'}</p><div class="row"><button class="pill" id="deleteL">Eliminar</button><button class="pill dark" onclick="closeModal()">Cerrar</button></div>`);$('#deleteL').onclick=()=>{if(!confirm('¿Eliminar esta carta?'))return;db.letters=db.letters.filter(x=>x.id!==id);save();closeModal();render()}}
let ctx,canvas,brush='pen',stroke=[],drawing=false;function setupDraw(){canvas=$('#draw');if(!canvas)return;const r=canvas.getBoundingClientRect(),scale=devicePixelRatio||1;canvas.width=Math.max(1,Math.floor(r.width*scale));canvas.height=Math.max(1,Math.floor(r.height*scale));ctx=canvas.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#fffdf8';ctx.fillRect(0,0,r.width,r.height);stroke=[];const pos=e=>{const b=canvas.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);stroke.push(canvas.toDataURL());const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.globalCompositeOperation=brush==='eraser'?'destination-out':'source-over';ctx.globalAlpha=brush==='marker'?.25:brush==='pencil'?.55:1;ctx.strokeStyle=$('#inkColor').value;ctx.lineWidth=(+$('#brushSize').value)*(brush==='marker'?2:1);ctx.lineJoin=ctx.lineCap='round';ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.globalAlpha=1});canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false)}function setBrush(b){brush=b;toast(({pen:'Pluma',marker:'Marcador',pencil:'Lápiz',eraser:'Borrador'})[b])}function drawClear(){if(!ctx)return;stroke.push(canvas.toDataURL());ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fffdf8';ctx.fillRect(0,0,canvas.width,canvas.height)}function drawUndo(){const src=stroke.pop();if(!src)return;const im=new Image;im.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.clientWidth,canvas.clientHeight)};im.src=src}function drawSave(){if(!canvas)return;promptText('Guardar dibujo','Nombre de este dibujo','Nuestro dibujo',v=>{db.drawings.unshift({id:uid(),src:canvas.toDataURL('image/png'),title:v||'Nuestro dibujo'});save();render();toast('Dibujo guardado')})}function viewDrawing(id){const d=db.drawings.find(x=>x.id===id);if(!d)return;openModal(`<h3>${esc(d.title)}</h3><img style="width:100%;max-height:55dvh;object-fit:contain;background:#fff" src="${d.src}"><div class="row"><button class="pill" id="deleteD">Eliminar</button><button class="pill dark" onclick="closeModal()">Cerrar</button></div>`);$('#deleteD').onclick=()=>{if(!confirm('¿Eliminar este dibujo?'))return;db.drawings=db.drawings.filter(x=>x.id!==id);save();closeModal();render()}}
const help={bien:['Dame un abrazo','Vamos por un postre','Vamos a caminar','Quédate un ratito conmigo'],triste:['Abrázame, sin preguntas','Acompáñame en silencio','Ven a verme','Veamos una peli juntos','Escúchame un ratito'],estres:['Vamos a dar una vuelta','Ayúdame a descansar','Pide algo de comer conmigo','Dame un poco de espacio','Abrázame'],enojo:['Dame un tiempo y hablamos','Escúchame sin interrumpir','Podemos hablar más tarde','Vamos a caminar','Solo acompáñame'],cansancio:['Déjame dormir un poco','Ven a descansar conmigo','Pongamos una película','Pidamos comida','Ayúdame con algo pequeño'],calma:['Vamos a la playa','Salgamos al cine','Cocinemos algo','Quédate conmigo','Vamos por un helado']};const moodTalk={bien:'¿Te gustaría hacer algo conmigo?',triste:'Estoy aquí. ¿Qué te haría sentir acompañada/o?',estres:'¿Hay algo que pueda hacer para aliviarte el día?',enojo:'No tenemos que resolverlo ahora. ¿Qué necesitas de mí?',cansancio:'¿Qué podría hacer para que descanses un poco?',calma:'¿Compartimos un ratito juntos?'};function mood(id){chosenMood=id;chosenHelp=null;renderHelp();document.querySelectorAll('.feel-card').forEach(e=>e.classList.toggle('active',e.getAttribute('onclick')===`mood('${id}')`));$('#moodMessage').innerHTML=`<p class="hand">${esc(moodTalk[id])}</p><p class="muted">Elige un gesto en la página de al lado, o deja tu elección para otro momento.</p>`}function renderHelp(){if(!$('#helpOptions'))return;const opts=help[chosenMood]||['Un abrazo','Que me escuches','Estar juntos sin hablar','Un rato a solas'];$('#helpOptions').innerHTML=opts.map((x,i)=>`<button class="${chosenHelp===x?'active':''}" onclick="chosenHelp=${JSON.stringify(x).replace(/"/g,'&quot;')};renderHelp()">${esc(x)}</button>`).join('')}function storeRequest(){if(!chosenMood||!chosenHelp)return toast('Elige primero cómo te sientes y qué te ayudaría');db.notes.unshift({id:uid(),type:'request',mood:chosenMood,help:chosenHelp,date:Date.now(),shared:false});save();toast('Pedido guardado. Míralo en Nuestro buzón');renderLatest()}function renderLatest(){const el=$('#latestNote');if(!el)return;const n=db.notes[0];el.textContent=n?'Última nota: '+(n.help||n.together||'Una reflexión guardada'):'Todavía no hay notas guardadas.'}
function reflection(){openModal(`<h3>Dejo algo / me llevo algo</h3><p class="muted">No hace falta responder todo hoy. Puedes escribir algo para ti y una idea que quisieras intentar juntos.</p><label>Para mí · algo que quiero soltar</label><textarea id="leave" rows="3" placeholder="Algo que hoy quiero dejar de cargar..."></textarea><label>Para nosotros · algo que me gustaría intentar</label><textarea id="take" rows="3" placeholder="Algo que podríamos hacer diferente juntos..."></textarea><div class="row"><button class="pill dark" id="saveReflect">Guardar para mí</button><button class="pill" onclick="closeModal()">Cancelar</button></div>`);$('#saveReflect').onclick=()=>{const leave=$('#leave').value.trim(),together=$('#take').value.trim();if(!leave&&!together)return toast('Escribe lo que quieras guardar');db.notes.unshift({id:uid(),type:'reflection',leave,together,date:Date.now(),shared:false});save();closeModal();renderLatest();toast('Tu reflexión quedó guardada aquí')}}
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='antanda-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Copia descargada')};render();
</script></body></html>
